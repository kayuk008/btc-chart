<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC/USDT</title>
<style>
  html, body { margin:0; padding:0; background:#0e1116; color:#e6e6e6; font-family:Helvetica,Arial,sans-serif; }
  #top { padding:10px 14px; }
  #price { font-size:28px; font-weight:bold; }
  #meta { color:#8a8f98; font-size:13px; margin-top:2px; }
  #up { color:#26a69a; }
  #down { color:#ef5350; }
  canvas { display:block; width:100%; }
  select { background:#1b1f27; color:#e6e6e6; border:1px solid #333; padding:6px; font-size:14px; margin-top:6px; }
  #err { color:#ef5350; font-size:12px; padding:0 14px; }
</style>
</head>
<body>

<div id="top">
  <div id="price">-- USDT</div>
  <div id="meta">BTC/USDT &middot; обновлено: --</div>
  <select id="tf" onchange="load()">
    <option value="1m" selected>1 минута</option>
    <option value="5m">5 минут</option>
    <option value="15m">15 минут</option>
    <option value="1h">1 час</option>
    <option value="4h">4 часа</option>
  </select>
</div>
<div id="err"></div>
<canvas id="c"></canvas>

<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var REFRESH_MS = 20000;
var HISTORY_LIMIT = 150;
var MIN_VISIBLE = 15;
var MAX_VISIBLE = HISTORY_LIMIT;
var visibleCount = 60;
var candles = [];

function resize() {
  var w = window.innerWidth;
  canvas.width = w;
  canvas.height = Math.round(window.innerHeight * 0.65);
  if (candles.length) drawCandles(getVisible());
}
window.onresize = resize;
resize();

function fmt(n) {
  if (n >= 1000) return n.toFixed(1);
  return n.toFixed(2);
}

var AXIS_W = 62;

function niceStep(rawStep) {
  var pow10 = Math.pow(10, Math.floor(Math.log(rawStep) / Math.LN10));
  var frac = rawStep / pow10;
  var niceFrac;
  if (frac < 1.5) niceFrac = 1;
  else if (frac < 3) niceFrac = 2;
  else if (frac < 7) niceFrac = 5;
  else niceFrac = 10;
  return niceFrac * pow10;
}

function drawCandles(candles) {
  var W = canvas.width, H = canvas.height;
  var chartW = W - AXIS_W;
  ctx.clearRect(0, 0, W, H);

  var min = Infinity, max = -Infinity;
  for (var i = 0; i < candles.length; i++) {
    if (candles[i].low < min) min = candles[i].low;
    if (candles[i].high > max) max = candles[i].high;
  }
  var pad = (max - min) * 0.08;
  min -= pad; max += pad;

  var n = candles.length;
  var RIGHT_MARGIN_CANDLES = 3;
  var slot = chartW / (n + RIGHT_MARGIN_CANDLES);
  var bodyW = Math.max(1, slot * 0.6);

  function y(price) {
    return H - ((price - min) / (max - min)) * H;
  }

  var step = niceStep((max - min) / 6);
  var gridStart = Math.ceil(min / step) * step;
  ctx.strokeStyle = '#1e232c';
  ctx.fillStyle = '#6b7280';
  ctx.font = '11px Helvetica,Arial,sans-serif';
  ctx.textBaseline = 'middle';
  for (var p = gridStart; p < max; p += step) {
    var gy = y(p);
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(chartW, gy);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillText(fmt(p), chartW + 6, gy);
  }

  for (var i = 0; i < n; i++) {
    var c = candles[i];
    var x = i * slot + slot / 2;
    var up = c.close >= c.open;
    ctx.strokeStyle = up ? '#26a69a' : '#ef5350';
    ctx.fillStyle = up ? '#26a69a' : '#ef5350';

    ctx.beginPath();
    ctx.moveTo(x, y(c.high));
    ctx.lineTo(x, y(c.low));
    ctx.lineWidth = 1;
    ctx.stroke();

    var yOpen = y(c.open), yClose = y(c.close);
    var top = Math.min(yOpen, yClose);
    var h = Math.max(1, Math.abs(yClose - yOpen));
    ctx.fillRect(x - bodyW / 2, top, bodyW, h);
  }

  var lastPrice = candles[n - 1].close;
  var ly = y(lastPrice);
  ctx.strokeStyle = '#e6e6e6';
  if (ctx.setLineDash) ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(0, ly);
  ctx.lineTo(chartW, ly);
  ctx.stroke();
  if (ctx.setLineDash) ctx.setLineDash([]);
  ctx.fillStyle = '#e6e6e6';
  ctx.fillRect(chartW, ly - 9, AXIS_W, 18);
  ctx.fillStyle = '#0e1116';
  ctx.font = 'bold 11px Helvetica,Arial,sans-serif';
  ctx.fillText(fmt(lastPrice), chartW + 6, ly);
}

var ws = null;
var pollTimer = null;
var usingWS = false;

function getVisible() {
  var count = Math.min(visibleCount, candles.length);
  return candles.slice(candles.length - count);
}

function updateHeader() {
  if (candles.length === 0) return;
  var last = candles[candles.length - 1];
  var prev = candles[candles.length - 2] || last;
  var priceEl = document.getElementById('price');
  priceEl.innerText = fmt(last.close) + ' USDT';
  priceEl.className = last.close >= prev.close ? 'up' : 'down';

  var now = new Date();
  var hh = ('0' + now.getHours()).slice(-2);
  var mm = ('0' + now.getMinutes()).slice(-2);
  var ss = ('0' + now.getSeconds()).slice(-2);
  var mode = usingWS ? 'live' : 'опрос';
  document.getElementById('meta').innerText = 'BTC/USDT \u00b7 ' + mode + ' \u00b7 ' + hh + ':' + mm + ':' + ss;
}

function xhrGetHistory(tf, cb) {
  var url = 'https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=' + tf + '&limit=' + HISTORY_LIMIT;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 10000;
  xhr.onload = function() {
    if (xhr.status !== 200) {
      document.getElementById('err').innerText = 'Ошибка загрузки (' + xhr.status + ')';
      return;
    }
    var raw = JSON.parse(xhr.responseText);
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      out.push({
        open: parseFloat(raw[i][1]),
        high: parseFloat(raw[i][2]),
        low: parseFloat(raw[i][3]),
        close: parseFloat(raw[i][4]),
        openTime: raw[i][0]
      });
    }
    document.getElementById('err').innerText = '';
    cb(out);
  };
  xhr.onerror = function() {
    document.getElementById('err').innerText = 'Нет соединения с Binance API';
  };
  xhr.ontimeout = function() {
    document.getElementById('err').innerText = 'Таймаут запроса';
  };
  xhr.send();
}

function startPollingFallback(tf) {
  usingWS = false;
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function() {
    xhrGetHistory(tf, function(hist) {
      candles = hist;
      drawCandles(getVisible());
      updateHeader();
    });
  }, REFRESH_MS);
}

function startWS(tf) {
  if (ws) { ws.onclose = null; ws.close(); }
  var stream = 'btcusdt@kline_' + tf;
  try {
    ws = new WebSocket('wss://stream.binance.com:9443/ws/' + stream);
  } catch (e) {
    startPollingFallback(tf);
    return;
  }

  var wsReady = false;

  ws.onopen = function() {
    wsReady = true;
    usingWS = true;
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    document.getElementById('err').innerText = '';
  };

  ws.onmessage = function(evt) {
    var msg = JSON.parse(evt.data);
    var k = msg.k;
    var cndl = {
      open: parseFloat(k.o),
      high: parseFloat(k.h),
      low: parseFloat(k.l),
      close: parseFloat(k.c),
      openTime: k.t
    };
    if (candles.length && candles[candles.length - 1].openTime === cndl.openTime) {
      candles[candles.length - 1] = cndl;
    } else {
      candles.push(cndl);
      if (candles.length > HISTORY_LIMIT) candles.shift();
    }
    drawCandles(getVisible());
    updateHeader();
  };

  ws.onerror = function() {
    if (!wsReady) startPollingFallback(tf);
  };

  ws.onclose = function() {
    usingWS = false;
    document.getElementById('err').innerText = 'Live-соединение прервано, переключение на опрос';
    startPollingFallback(tf);
  };
}

function load() {
  var tf = document.getElementById('tf').value;
  usingWS = false;
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }

  xhrGetHistory(tf, function(hist) {
    candles = hist;
    drawCandles(getVisible());
    updateHeader();
    startWS(tf);
  });
}

function touchDist(touches) {
  var dx = touches[0].clientX - touches[1].clientX;
  var dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

var pinchStartDist = null;
var pinchStartCount = null;

canvas.addEventListener('touchstart', function(e) {
  if (e.touches.length === 2) {
    pinchStartDist = touchDist(e.touches);
    pinchStartCount = visibleCount;
    e.preventDefault();
  }
}, false);

canvas.addEventListener('touchmove', function(e) {
  if (e.touches.length === 2 && pinchStartDist) {
    e.preventDefault();
    var dist = touchDist(e.touches);
    var scale = pinchStartDist / Math.max(dist, 1);
    var newCount = Math.round(pinchStartCount * scale);
    newCount = Math.max(MIN_VISIBLE, Math.min(MAX_VISIBLE, newCount));
    if (newCount !== visibleCount) {
      visibleCount = newCount;
      if (candles.length) drawCandles(getVisible());
    }
  }
}, false);

canvas.addEventListener('touchend', function(e) {
  if (e.touches.length < 2) pinchStartDist = null;
}, false);

canvas.addEventListener('wheel', function(e) {
  e.preventDefault();
  var factor = e.deltaY > 0 ? 1.12 : 0.89;
  var newCount = Math.round(visibleCount * factor);
  newCount = Math.max(MIN_VISIBLE, Math.min(MAX_VISIBLE, newCount));
  visibleCount = newCount;
  if (candles.length) drawCandles(getVisible());
}, false);

load();
</script>

</body>
</html>
